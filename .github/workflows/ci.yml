name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A merge landing while the previous one still builds cancels it, so `edge` cannot be
# overwritten by an older commit whose build happened to finish last. Tags and PRs run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  ci:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # Waku evaluates server modules during the build, so provide build-time values.
      # These are disposable placeholders and never reach a deployed image.
      - name: Build
        run: npm run build
        env:
          HANGAR_DATA_DIR: /tmp/hangar
          HANGAR_DB_HOST: /tmp/hangar/hangar.db
          HANGAR_STORE_URL: https://example.com/store.git
          DOMAIN: example.com
          BETTER_AUTH_URL: http://localhost:3010
          BETTER_AUTH_SECRET: build-only-secret-at-least-32-characters

  # The Cargo workspace under crates/, beside the Node app, which it does not touch. The image holds its binary, built
  # in the Dockerfile's `cli` stage, which `image-cli` checks; it does not wait for these tests: until the switch, a
  # failing Rust test must not stop the Node image from publishing.
  rust:
    name: Rust
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Docs
        run: cargo doc --workspace --all-features --no-deps --locked

  # The static `hangar` binary, for a host with no Rust toolchain, as Unraid. Each architecture builds on its own runner,
  # with musl-tools' musl-gcc compiling the C of rustls' crypto (aws-lc-sys, ring): no cross toolchain. Every run keeps
  # it as an artifact; a `v*` tag attaches it to its release, in `release-cli`.
  cli:
    name: CLI ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      BINARY: hangar-${{ matrix.target }}
      # The tag, which the binary prints for `--version`; empty off a tag, for the workspace's version with `-dev`.
      HANGAR_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p hangar-cli --target ${{ matrix.target }}

      # No interpreter and no shared library: the binary runs on a host whatever its libc.
      - name: Check that it is static
        run: |
          binary=target/${{ matrix.target }}/release/hangar
          file "$binary"
          if readelf --program-headers --dynamic "$binary" | grep -E 'INTERP|NEEDED'; then
            echo "::error::$binary is linked dynamically"
            exit 1
          fi
          version=$("$binary" --version)
          echo "$version"
          if [ -n "$HANGAR_VERSION" ] && [ "$version" != "hangar ${HANGAR_VERSION#v}" ]; then
            echo "::error::$binary prints $version for $HANGAR_VERSION"
            exit 1
          fi

      - name: Package with its checksum
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/hangar "dist/$BINARY"
          cd dist && sha256sum "$BINARY" > "$BINARY.sha256"

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}
          path: dist/*
          retention-days: 14

  # A release cut with `gh release create vX.Y.Z` exists by the time this runs; a tag pushed alone gets one, without
  # notes, for the maintainer to write. Its assets keep no version in their names, so that
  # `releases/latest/download/<name>` always names the newest.
  release-cli:
    name: Attach the CLI to the release
    needs: [rust, cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: hangar-*
          merge-multiple: true

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # The Dockerfile's `cli` stage on every run, as the image job builds it on a push alone: a change that breaks the
  # build on Alpine fails here, before it stops `edge` or a release from publishing. amd64 alone, arm64 building the
  # same sources natively.
  image-cli:
    name: Build the image's CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Its own cache scope: writing the image's would replace that cache with the `cli` stage's layers alone.
      - name: Build the cli stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cli
          platforms: linux/amd64
          push: false
          cache-from: |
            type=gha,scope=image-cli
            type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max,scope=image-cli

  image:
    name: Build ${{ matrix.platform }}
    needs: [ci, image-cli]
    # A merged PR (a push to main) publishes `edge`; a `v*` tag publishes the release.
    if: github.event_name == 'push'

    # Each platform builds on its own architecture: QEMU emulation crashes Node
    # with SIGILL during the Waku build. Free arm64 runners, no emulation.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only - the tags are attached to the manifest in `manifest`.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # The tag, which the binary prints for `--version`; empty on `main`.
          build-args: HANGAR_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: Publish image
    needs: image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
