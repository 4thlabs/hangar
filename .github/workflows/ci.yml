name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # Waku evaluates server modules during the build, so provide build-time values.
      # These are disposable placeholders and never reach a deployed image.
      - name: Build
        run: npm run build
        env:
          HANGAR_DATA_DIR: /tmp/hangar
          HANGAR_DB_HOST: /tmp/hangar/hangar.db
          HANGAR_CONFIG_FILE: ${{ github.workspace }}/config/hangar.yml
          DOMAIN: example.com
          BETTER_AUTH_URL: http://localhost:3010
          BETTER_AUTH_SECRET: build-only-secret-at-least-32-characters
