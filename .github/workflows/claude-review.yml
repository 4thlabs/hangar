name: Claude review

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

# A push landing while the previous review runs cancels it: only the latest commit is worth reviewing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    # A draft is not ready to be read, and a pull request from a fork is not handed the repository's secrets.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review the pull request
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md first: its conventions are part of what you check.

            Look for, in this order:
            - bugs: wrong behaviour, unhandled cases, races, errors swallowed;
            - security: secrets, injection, what reaches the browser or the logs;
            - breaks of the AGENTS.md conventions (libraries and modules, imports, `server-only`, classes,
              translations, responsive layouts, readability);
            - missing or misleading tests for what changed.

            Read `gh pr view --comments` first and do not repeat a point already raised. Put each finding on
            the line it is about with an inline comment, saying what goes wrong and how to fix it. Skip style
            nits Prettier or ESLint would catch. Then post one short summary with `gh pr comment`; if nothing
            is worth raising, say so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
