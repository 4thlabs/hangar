[package]
name = "hangar-core"
description = "The core of Hangar, on no web framework: running commands and Docker, and soon the store and compose"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures = "0.3"
# The client side alone: the core depends on no web framework.
quoll = { git = "https://github.com/4thlabs/quoll", tag = "v0.10.0", features = ["client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
# The URL of a daemon on TCP, checked before the client is built, which reqwest reads with it too.
url = "2"

# SIGTERM, which lets a child stop on its own before the SIGKILL of tokio's `Child::kill`.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.32", features = ["signal"] }

[dev-dependencies]
# The statuses a fake answer of the daemon has.
http = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "test-util", "time"] }

# waitid, to see a child exit without reaping it.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.32", features = ["process", "signal"] }

[lints]
workspace = true
