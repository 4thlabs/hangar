[package]
name = "hangar-core"
description = "The core of Hangar, on no web framework: running commands, Docker, the store and compose"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The hashes of the users' passwords, argon2id in PHC strings, with their salts from the OS.
argon2 = "0.6"
futures.workspace = true
# The include and exclude globs of an app's backup, as the Waku version's picomatch reads them with `dot: true`.
globset = "0.4"
# The timestamps of `.env.global`'s header and of its `.bak` copies.
jiff = { version = "0.2", default-features = false, features = ["std"] }
# The client side alone: the core depends on no web framework.
quoll = { workspace = true, features = ["client"] }
# The patterns of the Waku version's rules, `.env.global`'s parser and the `${VARIABLES}` of the stacks, as written there.
regex = "1"
serde.workspace = true
serde_json.workspace = true
# `hangar.yml` and the compose files of the store, as the Waku version reads them with js-yaml.
serde_norway = "0.9"
# The path of the field at fault in a `hangar.yml` that does not parse.
serde_path_to_error = "0.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing.workspace = true
# The URL of a daemon on TCP, checked before the client is built, which reqwest reads with it too.
url = "2"
# The archives of an app's backup, deflated, as the Waku version's yazl writes them: no other method is read or written.
zip = { version = "9.8", default-features = false, features = ["deflate"] }

# SIGTERM, which lets a child stop on its own before the SIGKILL of tokio's `Child::kill`; `O_NOFOLLOW`, so that a
# backup never reads a file through a link; and the hostname, which tells the container Hangar runs in.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "hostname", "signal"] }

[dev-dependencies]
# The statuses a fake answer of the daemon has.
http.workspace = true
# The data directory of a test.
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "test-util", "time"] }

# waitid, to see a child exit without reaping it, and mkfifo, a FIFO the editor refuses.
[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs", "process", "signal"] }

[lints]
workspace = true
