[package]
name = "hangar-api"
description = "The contract of Hangar's server, in quoll: its routes and the types they carry, for the server, its clients and the page"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

# The server turns on `server`, a client and the tests `client`; the document needs neither.
[features]
server = ["quoll/server"]
client = ["quoll/client"]

[dependencies]
# The request a scheme of the contract's own reads its cookies from.
http.workspace = true
quoll.workspace = true
schemars = "1"
serde.workspace = true
# The params of an error, which its problem carries as extension members.
serde_json.workspace = true

[dev-dependencies]
# Every variant of `ErrorCode`, walked by its tests rather than listed by hand.
strum = { version = "0.28", features = ["derive"] }

[lints]
workspace = true
