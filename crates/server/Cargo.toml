[package]
name = "hangar-server"
description = "Hangar's server, on hangar-core and quoll: its API, under /api, and its page"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "hangar-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false }
hangar-api = { workspace = true, features = ["server"] }
hangar-core.workspace = true
# The decoded path of a request, which the trailing-slash redirect compares with the page's directories.
percent-encoding = "2"
quoll = { workspace = true, features = ["server"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber = "0.3"

[dev-dependencies]
hangar-api = { workspace = true, features = ["client"] }
http = "1"
reqwest = { version = "0.13", default-features = false }
tempfile.workspace = true

[lints]
workspace = true
