[workspace]
# The server rewritten in Rust, beside the Waku version, which stays the published image until the switch.
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# `rust-version` is set at the first release.
repository = "https://github.com/4thlabs/hangar"
publish = false

[workspace.dependencies]
futures = "0.3"
hangar-api = { path = "crates/api" }
hangar-core = { path = "crates/core" }
nix = "0.32"
quoll = { git = "https://github.com/4thlabs/quoll", tag = "v0.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = "1"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
