[workspace]
# The server rewritten in Rust, beside the Waku version, which stays the published image until the switch; its page
# is in `web/`, which no crate holds.
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# `rust-version` is set at the first release.
repository = "https://github.com/4thlabs/hangar"
publish = false

[workspace.dependencies]
futures = "0.3"
hangar-api = { path = "crates/api" }
hangar-core = { path = "crates/core" }
http = "1"
nix = "0.32"
quoll = { git = "https://github.com/4thlabs/quoll", tag = "v0.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# The config of `cargo quoll`, run from the root, its paths relative to it. The contract's binary writes the document,
# and orval the page's TypeScript from it, both gitignored.
[[workspace.metadata.quoll.api]]
package = "hangar-api"
bin = "openapi"
output = "web/openapi.json"
# Run in `web/`. `--no`: the orval of the page's package-lock.json, which `npm ci` installs, never one npx downloads.
after = [["npx", "--no", "orval"]]

# Run by `cargo quoll dev`, ready once its url accepts a connection, on a port of its own beside the Waku version's
# 3010. The page's vite.config.ts proxies `/api` to this url: the two change together. `cargo quoll dev` passes the
# server no variable: it inherits its own, `HOST=127.0.0.1 PORT=3011 cargo quoll dev`, as docs/development.md says.
[[workspace.metadata.quoll.server]]
package = "hangar-server"
url = "http://127.0.0.1:3011"

# The page: `dev` runs beside the server in `cargo quoll dev`, `build` after the document in `cargo quoll build`.
[workspace.metadata.quoll.web]
dir = "web"
dev = ["npm", "run", "dev"]
build = ["npm", "run", "build"]
